[project]
name = "iphone-gps-controller"
version = "0.6.0"
description = "Non-jailbreak iPhone GPS controller Web UI using pymobiledevice3"
authors = [{name = "Derek Yang", email = "derekjhyang@example.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.13"
keywords = ["iphone", "gps", "pymobiledevice3", "fastapi", "web-ui"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Utilities",
]
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pymobiledevice3>=4.18.0",
]

[project.optional-dependencies]
dev = [
  "black>=24.0.0",
  "flake8>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/derekjhyang/iphone-gps-controller-uv-py313"
Repository = "https://github.com/derekjhyang/iphone-gps-controller-uv-py313.git"
Issues = "https://github.com/derekjhyang/iphone-gps-controller-uv-py313/issues"

[tool.uv]
package = false

[tool.black]
line-length = 127
target-version = ['py313']

[tool.flake8]
max-line-length = 127
extend-ignore = ["E203", "W503"]
exclude = [".git", "__pycache__", ".venv", "venv"]
